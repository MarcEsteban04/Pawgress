<!--
  Confirm signup — the 6-digit code email.

  Supabase decides link-vs-code purely by which variable this template renders:
  a ConfirmationURL action sends a magic link, a Token action sends the code.
  There is no separate setting, so this file IS the switch.

  Those two names are written WITHOUT their braces on purpose. Go's template
  engine evaluates actions anywhere in the file, comments included, so writing
  the link variable out in full here would quietly render a real magic link into
  every email — and make the config read back as "this template sends a link".

  Inline styles only, and a table for layout. Every serious email client strips
  <style> blocks and none of them support flex or grid.
-->
<table
  width="100%"
  cellpadding="0"
  cellspacing="0"
  role="presentation"
  style="
    background: #dcdde0;
    padding: 32px 0;
    /* No quoted font names: the template is pasted through a dashboard textarea
       and rendered by Go's html/template, and a quoted family is one more thing
       that can come back escaped. Unquoted names are safe everywhere. */
    font-family: -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
  "
>
  <tr>
    <td align="center">
      <table
        width="100%"
        cellpadding="0"
        cellspacing="0"
        role="presentation"
        style="max-width: 480px; background: #ffffff; border-radius: 14px; padding: 36px 32px"
      >
        <tr>
          <td
            style="
              font-size: 20px;
              font-weight: 600;
              color: #14161c;
              letter-spacing: -0.02em;
              padding-bottom: 8px;
            "
          >
            Pawgress
          </td>
        </tr>
        <tr>
          <td style="font-size: 16px; line-height: 1.6; color: #656c7a; padding-bottom: 24px">
            Here is the code to confirm your email address.
          </td>
        </tr>
        <tr>
          <td align="center" style="padding-bottom: 24px">
            <div
              style="
                display: inline-block;
                background: #f3f4f8;
                border-radius: 12px;
                padding: 18px 28px;
                font-size: 34px;
                font-weight: 600;
                letter-spacing: 0.32em;
                color: #14161c;
              "
            >
              {{ .Token }}
            </div>
          </td>
        </tr>
        <tr>
          <td style="font-size: 14px; line-height: 1.6; color: #99a0af">
            The code expires in one hour. If you did not create a Pawgress account, you can ignore
            this email — nothing was set up.
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
