<!--
  Reset password — the 6-digit code email.

  As with confirm-signup, the variable this template renders IS the switch: a
  Token action sends a code, a ConfirmationURL action sends a link. Written
  without braces here on purpose — Go evaluates actions anywhere in the file,
  comments included.

  Inline styles only, and a table for layout. Every serious email client strips
  <style> blocks and none of them support flex or grid.
-->
<table
  width="100%"
  cellpadding="0"
  cellspacing="0"
  role="presentation"
  style="
    background: #dcdde0;
    padding: 32px 0;
    font-family: -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
  "
>
  <tr>
    <td align="center">
      <table
        width="100%"
        cellpadding="0"
        cellspacing="0"
        role="presentation"
        style="max-width: 480px; background: #ffffff; border-radius: 14px; padding: 36px 32px"
      >
        <tr>
          <td
            style="
              font-size: 20px;
              font-weight: 600;
              color: #14161c;
              letter-spacing: -0.02em;
              padding-bottom: 8px;
            "
          >
            Acadify
          </td>
        </tr>
        <tr>
          <td style="font-size: 16px; line-height: 1.6; color: #656c7a; padding-bottom: 24px">
            Here is the code to set a new password.
          </td>
        </tr>
        <tr>
          <td align="center" style="padding-bottom: 24px">
            <div
              style="
                display: inline-block;
                background: #f3f4f8;
                border-radius: 12px;
                padding: 18px 28px;
                font-size: 34px;
                font-weight: 600;
                letter-spacing: 0.32em;
                color: #14161c;
              "
            >
              {{ .Token }}
            </div>
          </td>
        </tr>
        <tr>
          <td style="font-size: 14px; line-height: 1.6; color: #99a0af">
            The code expires in one hour and can be used once. If you did not ask to reset your
            password, you can ignore this email — your password has not changed, and nothing you
            have uploaded is affected.
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
