<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:"IBM Plex Sans",system-ui,sans-serif;color:#1c1c1c;background:#fff;-webkit-font-smoothing:antialiased}
    a{color:#3d3d3d}a:hover{color:#000}
    .ph{width:360px;display:flex;flex-direction:column;background:#fff;overflow:hidden}
    .hd{flex:0 0 48px;display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid #e4e4e4}
    .hd .t{font-size:16px;font-weight:600;flex-grow:1}
    .av{width:28px;height:28px;border-radius:50%;background:#ededed;border:1px solid #dcdcdc}
    .bd{flex-grow:1;overflow:hidden;padding:14px;display:flex;flex-direction:column;gap:12px}
    .tb{flex:0 0 56px;display:flex;border-top:1px solid #e4e4e4}
    .tb>div{flex-grow:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;color:#9a9a9a}
    .tb>div.on{color:#1c1c1c;font-weight:600}
    .act{flex:0 0 auto;padding:10px 14px 14px;border-top:1px solid #efefef}
    .btn{height:48px;border:1px solid #1c1c1c;border-radius:10px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:15px;font-weight:600;background:#fff}
    .btnp{background:#1c1c1c;color:#fff}
    .card{border:1px solid #dcdcdc;border-radius:12px;padding:14px}
    .meta{font-size:12px;color:#767676;font-family:"IBM Plex Mono",ui-monospace,monospace}
    .row{display:flex;align-items:center;gap:10px}
    .bar{height:8px;border-radius:4px;background:#e8e8e8;overflow:hidden}
    .bar i{display:block;height:100%;background:#4a4a4a}
    .sq{width:38px;height:38px;flex:0 0 38px;border-radius:9px;background:#ededed;border:1px solid #e0e0e0;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#5f5f5f}
    .fld{flex-grow:1;height:40px;border:1px solid #d4d4d4;border-radius:10px;display:flex;align-items:center;gap:8px;padding:0 12px;font-size:14px;color:#9a9a9a}
  </style>
</helmet>

<div class="ph" style="height:840px">

  <div class="hd">
    <div class="t">Subjects</div>
    <div class="av"></div>
  </div>

  <div class="bd">

    <div class="row">
      <div class="fld">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9a9a9a" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.3-4.3"/></svg>
        Search
      </div>
      <div style="height:40px;border:1px solid #d4d4d4;border-radius:10px;display:flex;align-items:center;gap:6px;padding:0 12px;font-size:14px">Sort
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#6d6d6d" stroke-width="2" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>
      </div>
    </div>

    <div class="card" style="display:flex;flex-direction:column;gap:10px">
      <div class="row">
        <div class="sq">Bi</div>
        <div style="flex-grow:1">
          <div style="font-size:16px;font-weight:600">Biology</div>
          <div class="meta">6 files &middot; 3 topics</div>
        </div>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#b0b0b0" stroke-width="2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>
      </div>
      <div class="bar"><i style="width:61%"></i></div>
      <div class="row" style="justify-content:space-between">
        <div style="font-size:13px;font-weight:600">2 topics need work</div>
        <div class="meta">61%</div>
      </div>
    </div>

    <div class="card" style="display:flex;flex-direction:column;gap:10px">
      <div class="row">
        <div class="sq">Ma</div>
        <div style="flex-grow:1">
          <div style="font-size:16px;font-weight:600">Mathematics</div>
          <div class="meta">2 files &middot; no quizzes yet</div>
        </div>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#b0b0b0" stroke-width="2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>
      </div>
      <div style="font-size:13px;color:#5f5f5f">Take a quiz to see progress</div>
    </div>

    <div class="card" style="display:flex;flex-direction:column;gap:10px">
      <div class="row">
        <div class="sq">Pr</div>
        <div style="flex-grow:1">
          <div style="font-size:16px;font-weight:600">Programming</div>
          <div class="meta">1 file</div>
        </div>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#b0b0b0" stroke-width="2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>
      </div>
      <div class="row" style="gap:7px">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#6d6d6d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>
        <div style="font-size:13px;color:#5f5f5f">1 file still indexing</div>
      </div>
    </div>

    <div style="flex-grow:1"></div>
    <div class="meta" style="text-align:center">Cards carry a next action, not just stats</div>

  </div>

  <div class="act">
    <div class="btn btnp">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      New subject
    </div>
  </div>

  <div class="tb">
    <div>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-6 8 6v9H4z"/></svg>
      Home
    </div>
    <div class="on">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
      Subjects
    </div>
    <div>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v10H9l-5 4z"/></svg>
      Ask
    </div>
    <div>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19V9M12 19V5M19 19v-7"/></svg>
      Progress
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
