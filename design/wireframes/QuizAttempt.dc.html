<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:"IBM Plex Sans",system-ui,sans-serif;color:#1c1c1c;background:#fff;-webkit-font-smoothing:antialiased}
    a{color:#3d3d3d}a:hover{color:#000}
    .ph{width:360px;display:flex;flex-direction:column;background:#fff;overflow:hidden}
    .hd{flex:0 0 48px;display:flex;align-items:center;gap:12px;padding:0 14px}
    .meta{font-size:12px;color:#767676;font-family:"IBM Plex Mono",ui-monospace,monospace}
    .bar{height:4px;background:#e8e8e8;overflow:hidden}
    .bar i{display:block;height:100%;background:#4a4a4a}
    .bd{flex-grow:1;display:flex;flex-direction:column;padding:22px 16px 16px;gap:20px}
    .act{flex:0 0 auto;padding:12px 14px 18px;display:flex;gap:10px;border-top:1px solid #efefef}
    .btn{height:50px;border:1px solid #1c1c1c;border-radius:10px;display:flex;align-items:center;justify-content:center;gap:7px;font-size:15px;font-weight:600;background:#fff}
    .btnp{background:#1c1c1c;color:#fff}
    .opt{border:1px solid #d4d4d4;border-radius:11px;padding:14px;display:flex;align-items:center;gap:12px;font-size:15px;min-height:56px;background:#fff}
    .opt.sel{border-color:#1c1c1c;border-width:2px;background:#f5f5f5;font-weight:600;padding:13px}
    .k{width:26px;height:26px;flex:0 0 26px;border-radius:50%;border:1px solid #c4c4c4;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:#6d6d6d;font-family:"IBM Plex Mono",monospace}
    .k.sel{background:#1c1c1c;border-color:#1c1c1c;color:#fff}
    .dot{width:9px;height:9px;border-radius:50%;background:#dcdcdc}
    .dot.done{background:#8a8a8a}
    .dot.now{background:#1c1c1c;box-shadow:0 0 0 3px #e2e2e2}
  </style>
</helmet>

<div class="ph" style="height:840px">

  <div class="hd">
    <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#4a4a4a" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    <div style="flex-grow:1;text-align:center;font-size:13px;font-weight:600;font-family:'IBM Plex Mono',monospace">Question 3 of 10</div>
    <div style="width:21px"></div>
  </div>

  <div class="bar"><i style="width:30%"></i></div>

  <div class="bd">

    <div style="font-size:20px;font-weight:600;line-height:1.4;text-wrap:pretty">Which describes a heterozygous genotype?</div>

    <div style="display:flex;flex-direction:column;gap:10px">
      <div class="opt">
        <div class="k">A</div>
        <div style="flex-grow:1">Two identical alleles</div>
      </div>
      <div class="opt sel">
        <div class="k sel">B</div>
        <div style="flex-grow:1">Two different alleles</div>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1c1c1c" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>
      </div>
      <div class="opt">
        <div class="k">C</div>
        <div style="flex-grow:1">No alleles present</div>
      </div>
      <div class="opt">
        <div class="k">D</div>
        <div style="flex-grow:1">Three or more alleles</div>
      </div>
    </div>

    <div style="flex-grow:1"></div>

    <div>
      <div style="display:flex;gap:7px;justify-content:center;align-items:center">
        <div class="dot done"></div>
        <div class="dot done"></div>
        <div class="dot now"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>
      <div class="meta" style="text-align:center;margin-top:10px">Answers save as you tap — a reload restores them</div>
    </div>

  </div>

  <div class="act">
    <div class="btn" style="flex:0 0 106px">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 6l-6 6 6 6"/></svg>
      Back
    </div>
    <div class="btn btnp" style="flex-grow:1">
      Next
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
