<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:"IBM Plex Sans",system-ui,sans-serif;color:#1c1c1c;background:#fff;-webkit-font-smoothing:antialiased}
    a{color:#3d3d3d}a:hover{color:#000}
    .ph{width:360px;display:flex;flex-direction:column;background:#fff;overflow:hidden}
    .hd{flex:0 0 48px;display:flex;align-items:center;gap:12px;padding:0 14px}
    .meta{font-size:12px;color:#767676;font-family:"IBM Plex Mono",ui-monospace,monospace}
    .bar{height:4px;background:#e8e8e8;overflow:hidden}
    .bar i{display:block;height:100%;background:#4a4a4a}
    .bd{flex-grow:1;display:flex;flex-direction:column;padding:20px 16px;gap:14px}
    .act{flex:0 0 auto;padding:12px 14px 18px;display:flex;gap:10px}
    .btn{height:52px;border:1px solid #1c1c1c;border-radius:11px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px;font-weight:600;background:#fff;flex-grow:1}
    .btnp{background:#1c1c1c;color:#fff}
    .cite{font-family:"IBM Plex Mono",monospace;font-size:11px;color:#5f5f5f;border:1px solid #d8d8d8;border-radius:5px;padding:2px 6px}
  </style>
</helmet>

<div class="ph" style="height:840px">

  <div class="hd">
    <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#4a4a4a" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    <div style="flex-grow:1;text-align:center;font-size:13px;font-weight:600;font-family:'IBM Plex Mono',monospace">12 / 30</div>
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4a4a4a" stroke-width="2" stroke-linecap="round"><path d="M9 5v14M15 5v14"/></svg>
  </div>

  <div class="bar"><i style="width:40%"></i></div>

  <div class="bd">

    <div class="meta" style="text-align:center">Biology &middot; Genetics</div>

    <div style="flex-grow:1;display:flex;align-items:center">
      <div style="width:100%;border:1px solid #d4d4d4;border-radius:16px;background:#fafafa;padding:28px 22px;min-height:340px;display:flex;flex-direction:column;box-shadow:0 2px 0 #ececec">
        <div style="flex-grow:1;display:flex;align-items:center;justify-content:center">
          <div style="font-size:23px;font-weight:600;line-height:1.35;text-align:center;text-wrap:pretty">What does homozygous mean?</div>
        </div>
        <div style="display:flex;align-items:center;justify-content:space-between">
          <div class="meta">Tap to flip</div>
          <div class="cite">p.4</div>
        </div>
      </div>
    </div>

    <div class="meta" style="text-align:center">Verdict buttons stay disabled until the card is flipped</div>

  </div>

  <div class="act">
    <div class="btn" style="opacity:.45">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      Still learning
    </div>
    <div class="btn" style="opacity:.45">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>
      I knew it
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
